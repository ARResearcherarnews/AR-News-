name: Build news pages

on:
  schedule:
    - cron: "*/30 * * * *"   # প্রতি ৩০ মিনিটে
  workflow_dispatch:          # হাতে চালানোর বাটন
  push:
    paths:
      - "build-news.mjs"

permissions:
  contents: write

concurrency:
  group: build-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages and sitemap
        run: node build-news.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A news sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news pages and sitemap"
            git push
          fi
          
